services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sweety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@db:5432/sweety
      JWT_SECRET: docker-dev-secret-change-me
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
